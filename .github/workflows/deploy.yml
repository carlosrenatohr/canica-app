name: Deploy to Cloudflare

# canica-app is a pnpm monorepo: apps/api (Hono Worker) + apps/web (Next.js via OpenNext).
# On every push to main this workflow builds and deploys BOTH to Cloudflare using the same
# account (Honchkrow1995 / b91df20a84a77a2eda9dcc47a7bead73) as hit & rana.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN (token with "Workers Scripts: Edit" on the
# account above) and DATABASE_URL (postgres connection string, required secret of the worker).
# Create the token at https://dash.cloudflare.com/profile/api-tokens

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACCOUNT_ID: b91df20a84a77a2eda9dcc47a7bead73

jobs:
  api:
    name: Deploy API Worker (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Prepare DATABASE_URL secrets file
        env:
          DB_VALUE: ${{ secrets.DATABASE_URL }}
        working-directory: .
        run: |
          if [ -n "${DB_VALUE}" ]; then
            printf 'DATABASE_URL=%s\n' "${DB_VALUE}" > apps/api/secrets.env
          fi
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --minify ${{ secrets.DATABASE_URL != '' && '--secrets-file secrets.env' || '' }}
      - name: Clean up secrets file
        if: always()
        working-directory: .
        run: rm -f apps/api/secrets.env
      - name: Health check
        run: |
          BASE="${{ vars.API_BASE_URL || 'https://canica-api.honchkrow1995.workers.dev' }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health")
            echo "attempt $i: /health -> $code"
            if [ "$code" = "200" ]; then echo "Deploy healthy."; exit 0; fi
            sleep 5
          done
          echo "Health check failed after retries."; exit 1

  web:
    name: Deploy Web Worker (apps/web, OpenNext)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build OpenNext bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://canica-api.honchkrow1995.workers.dev' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_BASE_URL || 'https://canica-api.honchkrow1995.workers.dev' }}
        run: pnpm build:worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --minify